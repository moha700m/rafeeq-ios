name: SanadAI
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  SanadAI:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.sanadai
        PRODUCT_NAME: SanadAI
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SanadAI.entitlements
        OTHER_LDFLAGS: ["-lc++"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "سَنَد AI"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        UIDeviceFamily: [1]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "سَنَد يستخدم الكاميرا لقراءة النصوص والصور محلياً على جهازك."
        NSPhotoLibraryUsageDescription: "لاختيار صورة وقراءة النص منها محلياً."
        NSMicrophoneUsageDescription: "للمحادثة الصوتية مع المساعد."
        NSSpeechRecognitionUsageDescription: "لتحويل كلامك إلى نص على الجهاز."
        NSRemindersFullAccessUsageDescription: "ليتمكن الوكيل من إضافة تذكيرات بعد موافقتك."
        NSCalendarsFullAccessUsageDescription: "ليتمكن الوكيل من إضافة مواعيد بعد موافقتك."
        NSCalendarsWriteOnlyAccessUsageDescription: "ليتمكن الوكيل من إضافة مواعيد بعد موافقتك."
        NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة واتجاه القبلة لموقعك."
        NSLocalNetworkUsageDescription: "لتشغيل خادم API المحلي على شبكتك عند تفعيله."
        NSBonjourServices: ["_http._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
  SanadAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.sanadai.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  SanadAI:
    build:
      targets:
        SanadAI: all
        SanadAITests: [test]
    test:
      targets:
        - SanadAITests
