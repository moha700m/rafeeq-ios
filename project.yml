name: SanadAI
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  SanadAI:
    type: application
    platform: iOS
    sources:
      - path: App
    postBuildScripts:
      - name: Embed llama.framework (device only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "$PLATFORM_NAME" = "iphoneos" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
            rsync -a --delete "$SRCROOT/Frameworks/device/llama.framework" "$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.sanadai
        PRODUCT_NAME: SanadAI
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SanadAI.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/Frameworks/device"
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["-framework", "llama", "-lc++"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "سَنَد AI"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: false
        UIDeviceFamily: [1]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "سَنَد يستخدم الكاميرا لقراءة النصوص والصور محلياً على جهازك."
        NSPhotoLibraryUsageDescription: "لاختيار صورة وقراءة النص منها محلياً."
        NSMicrophoneUsageDescription: "للمحادثة الصوتية مع المساعد."
        NSSpeechRecognitionUsageDescription: "لتحويل كلامك إلى نص على الجهاز."
        NSRemindersFullAccessUsageDescription: "ليتمكن الوكيل من إضافة تذكيرات بعد موافقتك."
        NSCalendarsFullAccessUsageDescription: "ليتمكن الوكيل من إضافة مواعيد بعد موافقتك."
        NSCalendarsWriteOnlyAccessUsageDescription: "ليتمكن الوكيل من إضافة مواعيد بعد موافقتك."
        NSLocationWhenInUseUsageDescription: "لحساب مواقيت الصلاة واتجاه القبلة لموقعك."
        NSLocalNetworkUsageDescription: "لتشغيل خادم API المحلي على شبكتك عند تفعيله."
        NSBonjourServices: ["_http._tcp"]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.moha700m.sanadai
            CFBundleURLSchemes: [sanad]
  SanadAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.sanadai.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  SanadAI:
    build:
      targets:
        SanadAI: all
        SanadAITests: [test]
    test:
      targets:
        - SanadAITests
