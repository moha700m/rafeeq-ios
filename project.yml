name: Rafeeq
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Rafeeq:
    type: application
    platform: iOS
    sources: [Rafeeq]
    dependencies:
      - target: RafeeqWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.rafeeq
        PRODUCT_NAME: Rafeeq
        INFOPLIST_FILE: Rafeeq/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
  RafeeqWidget:
    type: app-extension
    platform: iOS
    sources: [RafeeqWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.rafeeq.widget
        PRODUCT_NAME: RafeeqWidget
        INFOPLIST_FILE: RafeeqWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
  RafeeqTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RafeeqTests]
    dependencies:
      - target: Rafeeq
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.rafeeq.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Rafeeq:
    build:
      targets:
        Rafeeq: all
        RafeeqTests: [test]
    test:
      targets: [RafeeqTests]
