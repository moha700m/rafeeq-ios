name: Build Sanad AI
on:
  push:
    branches: [sanad-ai]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sanad-${{ github.ref }}
  cancel-in-progress: true
env:
  LLAMA_TAG: b11960
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Cache llama.xcframework
        uses: actions/cache@v4
        with:
          path: Frameworks/device
          key: llama-xcframework-${{ env.LLAMA_TAG }}
      - name: Fetch llama.cpp XCFramework
        run: ./scripts/fetch-llama.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          pref=('iPhone 17 Pro','iPhone 16 Pro','iPhone 17','iPhone 16')
          for want in pref:
            for rt,devs in sorted(d.items(), reverse=True):
              if 'iOS' not in rt: continue
              for x in devs:
                if x['name']==want: print(x['udid']); sys.exit()
          for rt,devs in d.items():
            if 'iOS' in rt:
              for x in devs:
                if x['name'].startswith('iPhone'): print(x['udid']); sys.exit()
          ")
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          xcrun simctl list devices | grep "$UDID"
      - name: Unit tests
        run: |
          set +e
          xcodebuild test -project SanadAI.xcodeproj -scheme SanadAI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          rc=$?
          grep -E "error:|Test Case.*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" test.log | tail -120
          exit $rc
      - name: Simulator screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcodebuild build -project SanadAI.xcodeproj -scheme SanadAI -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find build/sim/Build/Products -name "SanadAI.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { local name=$1; shift
            xcrun simctl terminate "$UDID" com.moha700m.sanadai || true
            xcrun simctl launch "$UDID" com.moha700m.sanadai "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 0-onboarding -resetOnboarding YES
          shot 1-chat -seenOnboard YES -demo YES -tab chat
          shot 2-agents -seenOnboard YES -demo YES -tab agents
          shot 3-agent-run -seenOnboard YES -demo YES -tab agents -screen agentRun
          shot 4-models -seenOnboard YES -tab models
          shot 5-lens -seenOnboard YES -tab lens
          shot 6-more -seenOnboard YES -tab more
          shot 7-saudi-tools -seenOnboard YES -tab more -screen saudi
          shot 8-server -seenOnboard YES -tab more -screen server
          xcrun simctl ui "$UDID" appearance dark
          shot 9-chat-dark -seenOnboard YES -demo YES -tab chat
          xcrun simctl ui "$UDID" appearance light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-logs
          path: |
            shots/
            test.log
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild archive -project SanadAI.xcodeproj -scheme SanadAI -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/SanadAI.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          rm -rf Payload && mkdir -p Payload
          cp -R build/SanadAI.xcarchive/Products/Applications/SanadAI.app Payload/
          A=Payload/SanadAI.app
          P=$A/Info.plist
          plutil -p "$P" | head -60
          plutil -extract UILaunchScreen xml1 -o - "$P" >/dev/null || { echo "::error::UILaunchScreen missing"; exit 1; }
          FAM=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' $P | tr -d ' \n')
          [ "$FAM" = "Array{1}" ] || { echo "::error::UIDeviceFamily not [1]"; exit 1; }
          test -d $A/Frameworks/llama.framework || { echo "::error::llama.framework not embedded"; ls -la $A/Frameworks || true; exit 1; }
          lipo -info $A/SanadAI
          zip -qry SanadAI.ipa Payload
          ls -la SanadAI.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SanadAI-ipa
          path: SanadAI.ipa
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="sanad-build-${{ github.run_number }}"
          gh release create "$TAG" SanadAI.ipa shots/*.png \
            --target "${{ github.sha }}" \
            --title "سَنَد AI — بناء ${{ github.run_number }} (غير موقّع)" \
            --notes "IPA غير موقّع جاهز للتوقيع عبر ESign. Commit ${{ github.sha }}. llama.cpp ${{ env.LLAMA_TAG }}."
